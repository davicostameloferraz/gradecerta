<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeCerta — Meus Horários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #14213D;
    --sidebar-active: #2D5BE0;
    --sidebar-text: #9AA6C3;
    --content-bg: #F5F6FA;
    --card: #FFFFFF;
    --border: #E5E7EF;
    --ink: #1C2430;
    --ink-soft: #6B7280;
    --blue: #2D5BE0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--content-bg); display: flex; min-height: 100vh; }

  .sidebar { width: 224px; flex-shrink: 0; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; padding: 18px 14px; position: sticky; top: 0; height: 100vh; }
  .sb-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .sb-brand img { width: 32px; height: 32px; border-radius: 8px; }
  .sb-brand .wordmark { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .sb-brand .wordmark .certa { color: #5EE6C7; }
  .sb-brand .sub { font-size: 10.5px; color: var(--sidebar-text); font-weight: 500; }
  .sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sb-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; font-weight: 600; }
  .sb-link .left { display: flex; align-items: center; gap: 10px; }
  .sb-link svg { width: 17px; height: 17px; flex-shrink: 0; }
  .sb-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .sb-link.active { background: var(--sidebar-active); color: #fff; }
  .sb-badge { background: #E0455C; color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 10px; }
  .sb-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sb-user .name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }
  .sb-user .turma { font-size: 11.5px; color: var(--sidebar-text); }
  .sb-logout { display: block; margin-top: 8px; padding: 0 8px; font-size: 12.5px; color: var(--sidebar-text); text-decoration: none; background: none; border: none; font-family: inherit; cursor: pointer; text-align: left; }
  .sb-logout:hover { color: #fff; }

  .main { flex: 1; padding: 28px 36px 48px; min-width: 0; }
  .main-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #1F9E8B; margin-bottom: 4px; }
  h1 { font-size: 25px; font-weight: 800; margin: 0; }
  .header-meta { font-size: 13px; color: var(--ink-soft); }
  .header-meta strong { color: var(--ink); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th { text-align: left; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); padding: 0 10px 12px; border-bottom: 1px solid var(--border); }
  th:first-child { width: 110px; }
  td { padding: 6px; vertical-align: top; }
  td:first-child { padding-left: 10px; }

  .horario-label { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .horario-hora { font-size: 11.5px; color: var(--ink-soft); }

  .aula-cell { border-radius: 10px; padding: 10px 12px; min-height: 56px; }
  .aula-materia { font-size: 13px; font-weight: 700; }
  .aula-professor { font-size: 12px; opacity: 0.85; }

  .intervalo-row td { padding: 4px 6px; }
  .intervalo-cell {
    background: var(--content-bg); border-radius: 8px; text-align: center;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-soft);
    padding: 6px; text-transform: uppercase;
  }

  .legend { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-soft); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .grupo-note { font-size: 12.5px; color: var(--ink-soft); margin: -10px 0 18px; }
  .grupo-note strong { color: var(--ink); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand">
    <img src="images/logo.png" alt="GradeCerta">
    <div>
      <div class="wordmark">Grade<span class="certa">Certa</span></div>
      <div class="sub">ETEC Jorge Street</div>
    </div>
  </div>

  <nav class="sb-nav">
    <a class="sb-link" href="painel-aluno.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Painel Principal
      </span>
    </a>
    <a class="sb-link active" href="meus-horarios.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
        Meus Horários
      </span>
    </a>
    <a class="sb-link" href="buscar-professor.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Buscar Professor
      </span>
    </a>
    <a class="sb-link" href="avisos.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        Avisos
      </span>
      <span class="sb-badge" id="avisosBadge">0</span>
    </a>
  </nav>

  <div class="sb-user">
    <div class="sb-avatar" id="sbInitials">--</div>
    <div>
      <div class="name" id="sbName">—</div>
      <div class="turma" id="sbTurma">—</div>
    </div>
  </div>
  <button class="sb-logout" id="logoutBtn">&larr; Sair</button>
</aside>

<main class="main">
  <div class="main-header">
    <div>
      <div class="eyebrow">ALUNO</div>
      <h1>Meus Horários Semanais</h1>
    </div>
    <div class="header-meta">Ano Letivo: <strong>2026</strong> &nbsp;|&nbsp; Etec Jorge Street</div>
  </div>

  <div class="card">
    <p class="grupo-note" id="grupoNote"></p>
    <table>
      <thead>
        <tr>
          <th>Horário</th>
          <th>Segunda</th><th>Terça</th><th>Quarta</th><th>Quinta</th><th>Sexta</th>
        </tr>
      </thead>
      <tbody id="tabelaBody"></tbody>
    </table>

    <div class="legend" id="legend"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script>
  gcSeedIfNeeded();

  const session = gcGetSession();
  if (!session || session.role !== 'aluno') {
    window.location.href = 'login.html';
  }

  const NOME_PARA_INICIAIS = (nome) => nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('sbName').textContent = session.name;
  document.getElementById('sbTurma').textContent = session.turma;
  document.getElementById('sbInitials').textContent = NOME_PARA_INICIAIS(session.name);
  document.getElementById('grupoNote').innerHTML = `Exibindo o horário de <strong>${session.turma} — Turma ${session.grupo}</strong>. As matérias técnicas em laboratório são divididas entre turmas A e B; as demais são compartilhadas.`;

  document.getElementById('logoutBtn').addEventListener('click', () => {
    gcClearSession();
    window.location.href = 'login.html';
  });

  const avisos = gcGetAvisosParaTurma(session.turma, session.grupo);
  document.getElementById('avisosBadge').textContent = avisos.length;

  // ---- Monta a tabela ----
  const semana = gcGetHorarioResolvido(session.turma, session.grupo);
  const dias = GC_DIAS_UTEIS; // segunda..sexta
  const linhasBase = semana.segunda; // usa segunda como referência de horários/linhas (mesma estrutura em todos os dias)
  const tbody = document.getElementById('tabelaBody');
  const categoriasUsadas = new Set();

  linhasBase.forEach((linhaRef, idx) => {
    const tr = document.createElement('tr');

    if (linhaRef.tipo === 'intervalo') {
      tr.className = 'intervalo-row';
      const tdHorario = document.createElement('td');
      tdHorario.innerHTML = `<div class="horario-label">Intervalo</div><div class="horario-hora">${linhaRef.inicio} - ${linhaRef.fim}</div>`;
      tr.appendChild(tdHorario);

      const tdIntervalo = document.createElement('td');
      tdIntervalo.colSpan = 5;
      tdIntervalo.innerHTML = `<div class="intervalo-cell">Intervalo</div>`;
      tr.appendChild(tdIntervalo);
      tbody.appendChild(tr);
      return;
    }

    const tdHorario = document.createElement('td');
    tdHorario.innerHTML = `<div class="horario-label">${linhaRef.periodo}ª Aula</div><div class="horario-hora">${linhaRef.inicio} - ${linhaRef.fim}</div>`;
    tr.appendChild(tdHorario);

    dias.forEach(dia => {
      const item = semana[dia][idx];
      const td = document.createElement('td');
      const cor = GC_CORES[item.categoria] || GC_CORES.tecnica;
      categoriasUsadas.add(item.categoria);
      td.innerHTML = `
        <div class="aula-cell" style="background:${cor.bg}; color:${cor.text};">
          <div class="aula-materia">${item.materia}</div>
          <div class="aula-professor">${item.professor}${item.sala ? ' · ' + item.sala : ''}</div>
        </div>`;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  // ---- Legenda (só as categorias realmente usadas na semana) ----
  const legendEl = document.getElementById('legend');
  const ordem = ['tecnica', 'lpl', 'ing', 'biol', 'edf', 'geo', 'hist', 'mat', 'quim', 'fis'];
  ordem.filter(cat => categoriasUsadas.has(cat)).forEach(cat => {
    const cor = GC_CORES[cat];
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${cor.dot}"></span>${cor.label}`;
    legendEl.appendChild(item);
  });
</script>

</body>
</html>
