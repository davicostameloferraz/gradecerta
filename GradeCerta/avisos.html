<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeCerta — Central de Avisos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #14213D;
    --sidebar-active: #2D5BE0;
    --sidebar-text: #9AA6C3;
    --content-bg: #F5F6FA;
    --card: #FFFFFF;
    --border: #E5E7EF;
    --ink: #1C2430;
    --ink-soft: #6B7280;
    --blue: #2D5BE0;
    --green: #16A34A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--content-bg); display: flex; min-height: 100vh; }

  .sidebar { width: 224px; flex-shrink: 0; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; padding: 18px 14px; position: sticky; top: 0; height: 100vh; }
  .sb-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .sb-brand img { width: 32px; height: 32px; border-radius: 8px; }
  .sb-brand .wordmark { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .sb-brand .wordmark .certa { color: #5EE6C7; }
  .sb-brand .sub { font-size: 10.5px; color: var(--sidebar-text); font-weight: 500; }
  .sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sb-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; font-weight: 600; }
  .sb-link .left { display: flex; align-items: center; gap: 10px; }
  .sb-link svg { width: 17px; height: 17px; flex-shrink: 0; }
  .sb-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .sb-link.active { background: var(--sidebar-active); color: #fff; }
  .sb-badge { background: #E0455C; color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 10px; }
  .sb-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sb-user .name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }
  .sb-user .turma { font-size: 11.5px; color: var(--sidebar-text); }
  .sb-logout { display: block; margin-top: 8px; padding: 0 8px; font-size: 12.5px; color: var(--sidebar-text); text-decoration: none; background: none; border: none; font-family: inherit; cursor: pointer; text-align: left; }
  .sb-logout:hover { color: #fff; }

  .main { flex: 1; padding: 28px 36px 48px; min-width: 0; }
  .main-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #1F9E8B; margin-bottom: 4px; }
  h1 { font-size: 25px; font-weight: 800; margin: 0; }
  .header-meta { font-size: 13px; color: var(--ink-soft); }
  .header-meta strong { color: var(--ink); }

  .lista { display: flex; flex-direction: column; gap: 16px; }
  .aviso-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
  .aviso-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .aviso-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px 4px 8px; border-radius: 999px; }
  .aviso-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .aviso-quando { font-size: 12.5px; color: var(--ink-soft); }
  .aviso-titulo { font-size: 16px; font-weight: 700; margin: 0 0 6px; }
  .aviso-msg { font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; margin: 0; }

  .comparativo { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; margin-top: 16px; background: var(--content-bg); border-radius: 10px; padding: 14px 18px; }
  .comparativo .label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; color: var(--ink-soft); margin-bottom: 4px; }
  .comparativo .original { text-decoration: line-through; color: var(--ink-soft); font-size: 13.5px; }
  .comparativo .novo { color: var(--green); font-weight: 700; font-size: 13.5px; }
  .comparativo .arrow { color: var(--ink-soft); }

  .empty-note { font-size: 13.5px; color: var(--ink-soft); background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 28px; text-align: center; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand">
    <img src="images/logo.png" alt="GradeCerta">
    <div>
      <div class="wordmark">Grade<span class="certa">Certa</span></div>
      <div class="sub">ETEC Jorge Street</div>
    </div>
  </div>

  <nav class="sb-nav">
    <a class="sb-link" href="painel-aluno.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Painel Principal
      </span>
    </a>
    <a class="sb-link" href="meus-horarios.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
        Meus Horários
      </span>
    </a>
    <a class="sb-link" href="buscar-professor.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Buscar Professor
      </span>
    </a>
    <a class="sb-link active" href="avisos.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        Avisos
      </span>
      <span class="sb-badge" id="avisosBadge">0</span>
    </a>
  </nav>

  <div class="sb-user">
    <div class="sb-avatar" id="sbInitials">--</div>
    <div>
      <div class="name" id="sbName">—</div>
      <div class="turma" id="sbTurma">—</div>
    </div>
  </div>
  <button class="sb-logout" id="logoutBtn">&larr; Sair</button>
</aside>

<main class="main">
  <div class="main-header">
    <div>
      <div class="eyebrow">ALUNO</div>
      <h1>Central de Avisos</h1>
    </div>
    <div class="header-meta">Ano Letivo: <strong>2026</strong> &nbsp;|&nbsp; Etec Jorge Street</div>
  </div>

  <div class="lista" id="lista"></div>
</main>

<script src="js/data.js"></script>
<script>
  gcSeedIfNeeded();

  const session = gcGetSession();
  if (!session || session.role !== 'aluno') {
    window.location.href = 'login.html';
  }

  const NOME_PARA_INICIAIS = (nome) => nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('sbName').textContent = session.name;
  document.getElementById('sbTurma').textContent = session.turma;
  document.getElementById('sbInitials').textContent = NOME_PARA_INICIAIS(session.name);

  document.getElementById('logoutBtn').addEventListener('click', () => {
    gcClearSession();
    window.location.href = 'login.html';
  });

  const avisos = gcGetAvisosParaTurma(session.turma, session.grupo);
  document.getElementById('avisosBadge').textContent = avisos.length;

  const listaEl = document.getElementById('lista');

  if (avisos.length === 0) {
    listaEl.innerHTML = '<div class="empty-note">Nenhum aviso por enquanto.</div>';
  } else {
    avisos.forEach(a => {
      const tipoInfo = GC_TIPOS_AVISO[a.tipo] || GC_TIPOS_AVISO.geral;
      const card = document.createElement('div');
      card.className = 'aviso-card';

      let comparativoHtml = '';
      if (a.tipo === 'reposicao' && a.original && a.novo) {
        comparativoHtml = `
          <div class="comparativo">
            <div>
              <div class="label">ORIGINAL (CANCELADO)</div>
              <div class="original">${a.original.diaLabel}, ${a.original.data} · ${a.original.hora} · ${a.original.sala}</div>
            </div>
            <div class="arrow">&rarr;</div>
            <div>
              <div class="label" style="color:${tipoInfo.dot}">NOVO (CONFIRMADO)</div>
              <div class="novo">${a.novo.diaLabel}, ${a.novo.data} · ${a.novo.hora} · ${a.novo.sala}</div>
            </div>
          </div>`;
      }

      card.innerHTML = `
        <div class="aviso-top">
          <span class="aviso-tag" style="background:${tipoInfo.bg}; color:${tipoInfo.text};">
            <span class="aviso-dot" style="background:${tipoInfo.dot}"></span>${tipoInfo.label}
          </span>
          <span class="aviso-quando">${gcFormatDataAviso(a)}</span>
        </div>
        <h2 class="aviso-titulo">${a.titulo}</h2>
        <p class="aviso-msg">${a.mensagem}</p>
        ${comparativoHtml}
      `;
      listaEl.appendChild(card);
    });
  }
</script>

</body>
</html>
