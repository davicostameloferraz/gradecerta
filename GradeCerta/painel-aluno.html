<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeCerta — Painel Principal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #14213D;
    --sidebar-active: #2D5BE0;
    --sidebar-text: #9AA6C3;
    --content-bg: #F5F6FA;
    --card: #FFFFFF;
    --border: #E5E7EF;
    --ink: #1C2430;
    --ink-soft: #6B7280;
    --teal: #1F9E8B;
    --amber-bg: #FDF5E1;
    --amber-border: #F0DB9E;
    --amber-ink: #8A5A12;
    --amber-strong: #6E4409;
    --blue: #2D5BE0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: var(--content-bg);
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 224px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .sb-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .sb-brand img { width: 32px; height: 32px; border-radius: 8px; }
  .sb-brand .wordmark { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .sb-brand .wordmark .certa { color: #5EE6C7; }
  .sb-brand .sub { font-size: 10.5px; color: var(--sidebar-text); font-weight: 500; }

  .sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sb-link {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 10px 12px; border-radius: 9px;
    color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; font-weight: 600;
  }
  .sb-link .left { display: flex; align-items: center; gap: 10px; }
  .sb-link svg { width: 17px; height: 17px; flex-shrink: 0; }
  .sb-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .sb-link.active { background: var(--sidebar-active); color: #fff; }
  .sb-badge {
    background: #E0455C; color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 999px; padding: 1px 7px;
  }

  .sb-user {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 10px;
  }
  .sb-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--blue);
    color: #fff; font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sb-user .name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }
  .sb-user .turma { font-size: 11.5px; color: var(--sidebar-text); }
  .sb-logout {
    display: block; margin-top: 8px; padding: 0 8px;
    font-size: 12.5px; color: var(--sidebar-text); text-decoration: none;
    background: none; border: none; font-family: inherit; cursor: pointer; text-align: left;
  }
  .sb-logout:hover { color: #fff; }

  /* Main */
  .main { flex: 1; padding: 28px 36px 48px; min-width: 0; }
  .main-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 22px; flex-wrap: wrap; gap: 10px;
  }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--teal); margin-bottom: 4px; }
  h1 { font-size: 25px; font-weight: 800; margin: 0; }
  .header-meta { font-size: 13px; color: var(--ink-soft); }
  .header-meta strong { color: var(--ink); }

  .banner {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--amber-bg); border: 1px solid var(--amber-border);
    border-radius: 12px; padding: 14px 18px; margin-bottom: 22px;
    font-size: 13.5px; color: var(--amber-strong); line-height: 1.5;
  }
  .banner svg { flex-shrink: 0; margin-top: 1px; }
  .banner b { color: var(--amber-strong); }

  .top-cards { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .card p { font-size: 13.5px; color: var(--ink-soft); margin: 0; line-height: 1.5; }

  .turma-card { display: flex; align-items: center; gap: 14px; }
  .turma-icon {
    width: 42px; height: 42px; border-radius: 50%; background: var(--blue);
    color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .turma-info .code { font-size: 15px; font-weight: 700; }
  .turma-info .meta { font-size: 12.5px; color: var(--ink-soft); }

  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 14px; }
  .aulas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }

  .aula-card {
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    background: var(--card);
  }
  .aula-card.status-agora { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .aula-card.status-passada { opacity: 0.5; }
  .aula-card.intervalo {
    background: #F1F2F6; border-style: dashed; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: var(--ink-soft);
  }

  .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em;
    padding: 3px 8px; border-radius: 999px; margin-bottom: 10px;
  }
  .badge.agora { background: var(--blue); color: #fff; }
  .badge.a-seguir { background: #E7E9F1; color: #4B5468; }

  .aula-materia { font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
  .materia-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .aula-hora { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .aula-detalhe { font-size: 12.5px; color: var(--blue); font-weight: 600; }
  .intervalo-label { font-size: 12.5px; font-weight: 700; margin-bottom: 3px; }
  .intervalo-hora { font-size: 12px; }

  .empty-note {
    font-size: 13.5px; color: var(--ink-soft); background: var(--card);
    border: 1px dashed var(--border); border-radius: 12px; padding: 18px; text-align: center;
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand">
    <img src="images/logo.png" alt="GradeCerta">
    <div>
      <div class="wordmark">Grade<span class="certa">Certa</span></div>
      <div class="sub" id="sbSchool">ETEC Jorge Street</div>
    </div>
  </div>

  <nav class="sb-nav">
    <a class="sb-link active" href="painel-aluno.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Painel Principal
      </span>
    </a>
    <a class="sb-link" href="meus-horarios.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
        Meus Horários
      </span>
    </a>
    <a class="sb-link" href="buscar-professor.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Buscar Professor
      </span>
    </a>
    <a class="sb-link" href="avisos.html">
      <span class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        Avisos
      </span>
      <span class="sb-badge" id="avisosBadge">0</span>
    </a>
  </nav>

  <div class="sb-user">
    <div class="sb-avatar" id="sbInitials">--</div>
    <div>
      <div class="name" id="sbName">—</div>
      <div class="turma" id="sbTurma">—</div>
    </div>
  </div>
  <button class="sb-logout" id="logoutBtn">&larr; Sair</button>
</aside>

<main class="main">
  <div class="main-header">
    <div>
      <div class="eyebrow">ALUNO</div>
      <h1>Painel Principal</h1>
    </div>
    <div class="header-meta">Ano Letivo: <strong>2026</strong> &nbsp;|&nbsp; Etec Jorge Street</div>
  </div>

  <div id="banners"></div>

  <div class="top-cards">
    <div class="card">
      <h2 id="saudacao">Olá!</h2>
      <p>Bem-vindo ao seu portal de horários ETEC. Veja suas disciplinas agendadas para hoje.</p>
    </div>
    <div class="card turma-card">
      <div class="turma-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
      </div>
      <div class="turma-info">
        <div class="code" id="turmaCode">—</div>
        <div class="meta" id="turmaMeta">—</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" id="aulasTitle">Aulas de Hoje</div>
    <div id="aulasContainer"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script>
  gcSeedIfNeeded();

  const session = gcGetSession();
  if (!session || session.role !== 'aluno') {
    window.location.href = 'login.html';
  }

  const NOME_PARA_INICIAIS = (nome) => nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();

  document.getElementById('sbName').textContent = session.name;
  document.getElementById('sbTurma').textContent = session.turma;
  document.getElementById('sbInitials').textContent = NOME_PARA_INICIAIS(session.name);
  document.getElementById('saudacao').textContent = 'Olá, ' + session.name.split(' ')[0] + ' ' + (session.name.split(' ')[1] || '') + '!';
  document.getElementById('turmaCode').textContent = session.turma;
  document.getElementById('turmaMeta').textContent = 'Período ' + session.periodo + ' • Ano 2026 • ETEC Jorge Street';

  document.getElementById('logoutBtn').addEventListener('click', () => {
    gcClearSession();
    window.location.href = 'login.html';
  });

  // ---- Avisos: badge + banners de reposição ----
  const avisos = gcGetAvisosParaTurma(session.turma, session.grupo);
  document.getElementById('avisosBadge').textContent = avisos.length;

  const bannersEl = document.getElementById('banners');
  avisos.filter(a => a.tipo === 'reposicao').forEach(a => {
    const div = document.createElement('div');
    div.className = 'banner';
    div.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>
        <b>Atenção: Reposição de Aula Confirmada</b> — Matéria: <b>${a.materia}</b> • Prof. <b>${a.professor}</b> •
        Nova Data: <b>${a.novo.diaLabel}, ${a.novo.data} às ${a.novo.hora}</b> • ${a.novo.sala}
        (Referente à aula perdida do dia ${a.original.data})
      </span>`;
    bannersEl.appendChild(div);
  });

  // ---- Aulas de hoje ----
  const diaChave = gcHojeChaveDia();
  const horarioSemana = gcGetHorarioResolvido(session.turma, session.grupo);
  const aulasHoje = horarioSemana[diaChave];
  const aulasContainer = document.getElementById('aulasContainer');
  document.getElementById('aulasTitle').textContent = 'Aulas de Hoje (' + GC_DIAS_LABEL[diaChave] + ')';

  if (!aulasHoje || aulasHoje.length === 0) {
    aulasContainer.innerHTML = '<div class="empty-note">Nenhum horário cadastrado para hoje ainda.</div>';
  } else {
    const agora = gcMinutosAgora();
    const grid = document.createElement('div');
    grid.className = 'aulas-grid';

    aulasHoje.forEach(item => {
      const card = document.createElement('div');
      const ini = gcParseHora(item.inicio), fim = gcParseHora(item.fim);

      if (item.tipo === 'intervalo') {
        card.className = 'aula-card intervalo';
        card.innerHTML = `<div class="intervalo-label">Intervalo</div><div class="intervalo-hora">${item.inicio} - ${item.fim}</div>`;
      } else {
        let statusClass = '', badgeHtml = '';
        if (agora >= ini && agora < fim) {
          statusClass = 'status-agora';
          badgeHtml = '<span class="badge agora">AGORA</span>';
        } else if (agora < ini) {
          statusClass = '';
          badgeHtml = `<span class="badge a-seguir">A SEGUIR (${item.inicio})</span>`;
        } else {
          statusClass = 'status-passada';
        }
        card.className = 'aula-card ' + statusClass;
        const cor = GC_CORES[item.categoria] || GC_CORES.tecnica;
        card.innerHTML = `
          ${badgeHtml}
          <div class="aula-materia"><span class="materia-dot" style="background:${cor.dot}"></span>${item.materia}</div>
          <div class="aula-hora">${item.inicio} - ${item.fim}</div>
          <div class="aula-detalhe">${item.professor}${item.sala ? ' · ' + item.sala : ''}</div>`;
      }
      grid.appendChild(card);
    });

    aulasContainer.appendChild(grid);
  }
</script>

</body>
</html>
