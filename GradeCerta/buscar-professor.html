<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeCerta — Buscar Professor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #14213D;
    --sidebar-active: #2D5BE0;
    --sidebar-text: #9AA6C3;
    --content-bg: #F5F6FA;
    --card: #FFFFFF;
    --border: #E5E7EF;
    --ink: #1C2430;
    --ink-soft: #6B7280;
    --teal: #1F9E8B;
    --blue: #2D5BE0;
    --blue-bg: #E1EAFD;
    --green: #16A34A;
    --green-bg: #E1F8E7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--content-bg); display: flex; min-height: 100vh; }

  .sidebar { width: 224px; flex-shrink: 0; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; padding: 18px 14px; position: sticky; top: 0; height: 100vh; }
  .sb-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .sb-brand img { width: 32px; height: 32px; border-radius: 8px; }
  .sb-brand .wordmark { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .sb-brand .wordmark .certa { color: #5EE6C7; }
  .sb-brand .sub { font-size: 10.5px; color: var(--sidebar-text); font-weight: 500; }
  .sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sb-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; font-weight: 600; }
  .sb-link .left { display: flex; align-items: center; gap: 10px; }
  .sb-link svg { width: 17px; height: 17px; flex-shrink: 0; }
  .sb-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .sb-link.active { background: var(--sidebar-active); color: #fff; }
  .sb-badge { background: #E0455C; color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 10px; }
  .sb-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sb-user .name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }
  .sb-user .turma { font-size: 11.5px; color: var(--sidebar-text); }
  .sb-logout { display: block; margin-top: 8px; padding: 0 8px; font-size: 12.5px; color: var(--sidebar-text); text-decoration: none; background: none; border: none; font-family: inherit; cursor: pointer; text-align: left; }
  .sb-logout:hover { color: #fff; }

  .main { flex: 1; padding: 28px 36px 48px; min-width: 0; }
  .main-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--teal); margin-bottom: 4px; }
  h1 { font-size: 25px; font-weight: 800; margin: 0; }
  .header-meta { font-size: 13px; color: var(--ink-soft); }
  .header-meta strong { color: var(--ink); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 18px; }

  .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .search-row select {
    flex: 1; min-width: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: #fff; outline: none;
  }
  .search-row select:focus { border-color: var(--blue); }

  .status-card { display: none; }
  .status-card.show { display: block; }
  .status-top { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .status-avatar {
    width: 46px; height: 46px; border-radius: 50%; background: var(--blue); color: #fff;
    font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .status-nome { font-size: 17px; font-weight: 700; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700;
    padding: 4px 11px; border-radius: 999px; margin-top: 3px;
  }
  .status-pill.ocupado { background: var(--blue-bg); color: #1E40AF; }
  .status-pill.livre { background: var(--green-bg); color: #15803D; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status-detalhe { font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
  .status-detalhe b { color: var(--ink); }

  table.grade { width: 100%; border-collapse: collapse; min-width: 760px; margin-top: 4px; }
  table.grade th { text-align: left; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); padding: 0 8px 10px; }
  table.grade td { padding: 4px; vertical-align: top; }
  td.horario-cell { white-space: nowrap; padding-right: 10px; }
  .horario-label { font-size: 12.5px; font-weight: 700; }
  .horario-hora { font-size: 11px; color: var(--ink-soft); }
  .bloco-row td { padding-top: 16px; padding-bottom: 4px; }
  .bloco-label { font-size: 12px; font-weight: 800; letter-spacing: 0.05em; color: var(--teal); text-transform: uppercase; }
  .slot-livre { display: block; text-align: center; padding: 10px 4px; border-radius: 8px; background: var(--content-bg); color: #A6ADBB; font-size: 12.5px; font-weight: 600; }
  .slot-aula { padding: 8px 10px; border-radius: 8px; background: var(--blue-bg); }
  .slot-aula .materia { font-size: 12.5px; font-weight: 700; color: #1E40AF; }
  .slot-aula .turma-sala { font-size: 11.5px; color: #3355B8; }
  .intervalo-row td { padding: 2px 4px; }
  .intervalo-cell { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #92620B; background: #FDF5E1; border-radius: 6px; padding: 8px 5px; }

  .empty-hint { font-size: 13.5px; color: var(--ink-soft); text-align: center; padding: 10px 0 2px; }
  .card-scroll { overflow-x: auto; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand">
    <img src="images/logo.png" alt="GradeCerta">
    <div>
      <div class="wordmark">Grade<span class="certa">Certa</span></div>
      <div class="sub">ETEC Jorge Street</div>
    </div>
  </div>

  <nav class="sb-nav">
    <a class="sb-link" href="painel-aluno.html">
      <span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Painel Principal</span>
    </a>
    <a class="sb-link" href="meus-horarios.html">
      <span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>Meus Horários</span>
    </a>
    <a class="sb-link active" href="buscar-professor.html">
      <span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Buscar Professor</span>
    </a>
    <a class="sb-link" href="avisos.html">
      <span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Avisos</span>
      <span class="sb-badge" id="avisosBadge">0</span>
    </a>
  </nav>

  <div class="sb-user">
    <div class="sb-avatar" id="sbInitials">--</div>
    <div>
      <div class="name" id="sbName">—</div>
      <div class="turma" id="sbTurma">—</div>
    </div>
  </div>
  <button class="sb-logout" id="logoutBtn">&larr; Sair</button>
</aside>

<main class="main">
  <div class="main-header">
    <div>
      <div class="eyebrow">ALUNO</div>
      <h1>Buscar Professor</h1>
    </div>
    <div class="header-meta">Ano Letivo: <strong>2026</strong> &nbsp;|&nbsp; Etec Jorge Street</div>
  </div>

  <div class="card">
    <div class="search-row">
      <select id="professorSelect">
        <option value="">Selecione um professor...</option>
      </select>
    </div>
    <div class="empty-hint" id="emptyHint">Escolha um professor pra ver onde ele está agora e a grade completa da semana.</div>
  </div>

  <div class="card status-card" id="statusCard">
    <div class="status-top">
      <div class="status-avatar" id="statusAvatar">--</div>
      <div>
        <div class="status-nome" id="statusNome">—</div>
        <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusPillTexto">—</span></div>
      </div>
    </div>
    <div class="status-detalhe" id="statusDetalhe"></div>
  </div>

  <div class="card status-card card-scroll" id="gradeCard">
    <table class="grade">
      <thead>
        <tr><th>Horário</th><th>Segunda</th><th>Terça</th><th>Quarta</th><th>Quinta</th><th>Sexta</th></tr>
      </thead>
      <tbody id="gradeBody"></tbody>
    </table>
  </div>
</main>

<script src="js/data.js"></script>
<script>
  gcSeedIfNeeded();

  const session = gcGetSession();
  if (!session || session.role !== 'aluno') {
    window.location.href = 'login.html';
  }

  const NOME_PARA_INICIAIS = (nome) => nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('sbName').textContent = session.name;
  document.getElementById('sbTurma').textContent = session.turma;
  document.getElementById('sbInitials').textContent = NOME_PARA_INICIAIS(session.name);

  document.getElementById('logoutBtn').addEventListener('click', () => {
    gcClearSession();
    window.location.href = 'login.html';
  });

  const avisos = gcGetAvisosParaTurma(session.turma, session.grupo);
  document.getElementById('avisosBadge').textContent = avisos.length;

  // ---- Popula a lista de professores ----
  const select = document.getElementById('professorSelect');
  gcGetListaProfessores().forEach(nome => {
    const opt = document.createElement('option');
    opt.value = nome; opt.textContent = nome;
    select.appendChild(opt);
  });

  const DIAS = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];
  const statusCard = document.getElementById('statusCard');
  const gradeCard = document.getElementById('gradeCard');
  const emptyHint = document.getElementById('emptyHint');

  select.addEventListener('change', () => {
    const nome = select.value;
    if (!nome) {
      statusCard.classList.remove('show');
      gradeCard.classList.remove('show');
      emptyHint.style.display = 'block';
      return;
    }
    emptyHint.style.display = 'none';
    mostrarProfessor(nome);
  });

  function mostrarProfessor(nome) {
    document.getElementById('statusAvatar').textContent = NOME_PARA_INICIAIS(nome);
    document.getElementById('statusNome').textContent = nome;

    const hojeChave = gcHojeChaveDia();
    const ocupacao = gcGetOcupacaoProfessor(nome);
    const agora = gcMinutosAgora();

    let aulaAgora = null;
    GC_PERIODOS_DIA.filter(p => !p.intervalo).forEach(p => {
      const a = ocupacao[hojeChave + '-' + p.periodo];
      if (a && agora >= gcParseHora(a.inicio) && agora < gcParseHora(a.fim)) aulaAgora = a;
    });

    const pill = document.getElementById('statusPill');
    const pillTexto = document.getElementById('statusPillTexto');
    const detalhe = document.getElementById('statusDetalhe');

    if (aulaAgora) {
      pill.className = 'status-pill ocupado';
      pillTexto.textContent = 'Em aula agora';
      detalhe.innerHTML = `Está com <b>${aulaAgora.turmaLabel}</b> em <b>${aulaAgora.materia}</b>, na <b>${aulaAgora.sala}</b>, até ${aulaAgora.fim}.`;
    } else {
      pill.className = 'status-pill livre';
      pillTexto.textContent = 'Livre no momento';
      detalhe.textContent = 'Sem aula agora, de acordo com a grade cadastrada.';
    }
    statusCard.classList.add('show');

    // ---- Grade completa da semana ----
    const gradeBody = document.getElementById('gradeBody');
    gradeBody.innerHTML = '';
    let blocoAtual = null;

    GC_PERIODOS_DIA.forEach(p => {
      if (p.bloco && p.bloco !== blocoAtual) {
        blocoAtual = p.bloco;
        const trBloco = document.createElement('tr');
        trBloco.className = 'bloco-row';
        trBloco.innerHTML = `<td colspan="6" class="bloco-label">${GC_BLOCO_LABEL[blocoAtual]}</td>`;
        gradeBody.appendChild(trBloco);
      }

      const tr = document.createElement('tr');
      if (p.intervalo) {
        tr.className = 'intervalo-row';
        tr.innerHTML = `<td class="horario-cell"><div class="horario-label">Intervalo</div><div class="horario-hora">${p.inicio} - ${p.fim}</div></td>` +
          `<td colspan="5"><div class="intervalo-cell">Intervalo</div></td>`;
        gradeBody.appendChild(tr);
        return;
      }

      let cells = `<td class="horario-cell"><div class="horario-label">${p.periodo}ª Aula</div><div class="horario-hora">${p.inicio} - ${p.fim}</div></td>`;
      DIAS.forEach(dia => {
        const aula = ocupacao[dia + '-' + p.periodo];
        if (aula) {
          cells += `<td><div class="slot-aula"><div class="materia">${aula.materia}</div><div class="turma-sala">${aula.turmaLabel} &middot; ${aula.sala}</div></div></td>`;
        } else {
          cells += `<td><span class="slot-livre">Livre</span></td>`;
        }
      });
      tr.innerHTML = cells;
      gradeBody.appendChild(tr);
    });

    gradeCard.classList.add('show');
  }
</script>

</body>
</html>
