<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeCerta — Horários por Sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #14213D;
    --sidebar-active: #2D5BE0;
    --sidebar-text: #9AA6C3;
    --content-bg: #F5F6FA;
    --card: #FFFFFF;
    --border: #E5E7EF;
    --ink: #1C2430;
    --ink-soft: #6B7280;
    --teal: #1F9E8B;
    --blue: #2D5BE0;
    --green: #16A34A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--content-bg); display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 224px; flex-shrink: 0; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; padding: 18px 14px; position: sticky; top: 0; height: 100vh; }
  .sb-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .sb-brand img { width: 32px; height: 32px; border-radius: 8px; }
  .sb-brand .wordmark { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .sb-brand .wordmark .certa { color: #5EE6C7; }
  .sb-brand .sub { font-size: 10.5px; color: var(--sidebar-text); font-weight: 500; }
  .sb-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sb-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; font-weight: 600; }
  .sb-link .left { display: flex; align-items: center; gap: 10px; }
  .sb-link svg { width: 17px; height: 17px; flex-shrink: 0; }
  .sb-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .sb-link.active { background: var(--sidebar-active); color: #fff; }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 10px; }
  .sb-avatar { width: 32px; height: 32px; border-radius: 50%; background: #6B7280; color: #fff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sb-user .name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }
  .sb-user .cargo { font-size: 11.5px; color: var(--sidebar-text); }
  .sb-logout { display: block; margin-top: 8px; padding: 0 8px; font-size: 12.5px; color: var(--sidebar-text); text-decoration: none; background: none; border: none; font-family: inherit; cursor: pointer; text-align: left; }
  .sb-logout:hover { color: #fff; }

  /* Main Content */
  .main { flex: 1; padding: 28px 36px 48px; min-width: 0; }
  .main-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--teal); margin-bottom: 4px; text-transform: uppercase; }
  h1 { font-size: 25px; font-weight: 800; margin: 0; }
  .header-meta { font-size: 13px; color: var(--ink-soft); }
  .header-meta strong { color: var(--ink); }

  /* Cards & Filters */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 26px; margin-bottom: 18px; }
  
  .filters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .input-group label { font-size: 11.5px; font-weight: 700; color: var(--sidebar-text); text-transform: uppercase; margin-bottom: 6px; display: block; letter-spacing: 0.05em; }
  .input-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 13.5px; font-family: inherit; color: var(--ink); outline: none; background: #fff; cursor: pointer; }
  .input-group select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(45, 91, 224, 0.1); }

  /* Table */
  .schedule-table { width: 100%; border-collapse: separate; border-spacing: 6px; }
  .schedule-table th { padding: 12px; font-size: 12px; font-weight: 700; color: var(--sidebar-text); text-transform: uppercase; text-align: center; border-bottom: 1px solid var(--border); width: 16%; }
  .schedule-table th:first-child { text-align: left; width: 14%; }
  
  .time-col { font-size: 11.5px; color: var(--ink-soft); font-weight: 500; text-align: left; padding: 12px 8px; }
  .time-col strong { display: block; font-size: 13.5px; color: var(--ink); font-weight: 800; margin-bottom: 4px; }
  
  .interval-row td { background: var(--content-bg); color: var(--sidebar-text); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; text-align: center; padding: 12px; border-radius: 9px; }
  .interval-row .time-col { background: transparent; text-align: left; }
  
  .cell-aula { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; border-radius: 9px; min-height: 85px; text-align: center; }
  .cell-materia { font-weight: 800; font-size: 14px; margin-bottom: 4px; }
  .cell-prof { font-size: 12px; font-weight: 500; opacity: 0.9; }
  .cell-turma { font-size: 11px; font-weight: 700; margin-top: 8px; background: rgba(0,0,0,0.06); padding: 3px 8px; border-radius: 6px; }
  
  .cell-livre { background: var(--content-bg); color: #A0AEC0; font-size: 13px; font-weight: 600; min-height: 85px; display: flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px dashed var(--border); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand">
    <img src="images/logo.png" alt="GradeCerta" onerror="this.style.display='none'">
    <div>
      <div class="wordmark">Grade<span class="certa">Certa</span></div>
      <div class="sub">ETEC Jorge Street</div>
    </div>
  </div>

  <nav class="sb-nav">
    <a class="sb-link" href="painel-de-controle.html"><span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Painel de Controle</span></a>
    <a class="sb-link" href="elaborar-horario.html"><span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Elaborar Horário</span></a>
    <a class="sb-link active" href="horarios-por-sala.html"><span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>Horários por Sala</span></a>
    
    <a class="sb-link" href="alertas.html"><span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alertas</span></a>
    <a class="sb-link" href="reposicao-aulas.html"><span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Reposição de Aulas</span></a>
    <a class="sb-link" href="professores-turma.html"><span class="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Professores e Turmas</span></a>
  </nav>

  <div class="sb-user">
    <div class="sb-avatar">M</div>
    <div>
      <div class="name">Coord. Márcia</div>
      <div class="cargo">Coordenação</div>
    </div>
  </div>
  <button class="sb-logout" id="logoutBtn">&larr; Sair</button>
</aside>

<main class="main">
  <div class="main-header">
    <div>
      <div class="eyebrow">COORDENAÇÃO</div>
      <h1>Consulta de Horário por Sala</h1>
    </div>
    <div class="header-meta">Ano Letivo: <strong>2026</strong> &nbsp;|&nbsp; Etec Jorge Street</div>
  </div>

  <div class="card">
    <div class="filters-grid">
      <div class="input-group">
        <label for="filtroSala">Sala / Laboratório</label>
        <select id="filtroSala" onchange="renderizarGrade()">
          <!-- Injetado pelo JavaScript -->
        </select>
      </div>
      <div class="input-group">
        <label for="filtroPeriodo">Período de Ocupação</label>
        <select id="filtroPeriodo" onchange="renderizarGrade()">
          <option value="manha">Manhã (07:10 - 12:30)</option>
          <option value="tarde" selected>Tarde (13:00 - 18:20)</option>
          <option value="noite">Noite (18:20 - 22:00)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card" style="padding: 16px 26px;">
    <table class="schedule-table">
      <thead>
        <tr>
          <th>Horário</th>
          <th>Segunda</th>
          <th>Terça</th>
          <th>Quarta</th>
          <th>Quinta</th>
          <th>Sexta</th>
        </tr>
      </thead>
      <tbody id="gradeBody">
        <!-- Injetado pelo JavaScript -->
      </tbody>
    </table>
  </div>
</main>

<script src="js/data.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Inicia a base de dados se necessário e preenche as salas
    if(typeof gcSeedIfNeeded === 'function') gcSeedIfNeeded();
    
    const selectSala = document.getElementById('filtroSala');
    const salas = typeof gcGetSalasDisponiveis === 'function' ? gcGetSalasDisponiveis() : [];
    
    if (salas.length === 0) {
      selectSala.innerHTML = '<option value="">Nenhuma sala mapeada no sistema</option>';
    } else {
      salas.forEach(sala => {
        const opt = document.createElement('option');
        opt.value = sala;
        opt.textContent = sala;
        selectSala.appendChild(opt);
      });
      // Executa a primeira renderização
      setTimeout(renderizarGrade, 50);
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    gcClearSession();
    window.location.href = 'login.html';
  });

  function renderizarGrade() {
    const sala = document.getElementById('filtroSala').value;
    const bloco = document.getElementById('filtroPeriodo').value;
    const tbody = document.getElementById('gradeBody');
    
    if (!sala || typeof gcGetGradePorSala !== 'function') return;

    const grade = gcGetGradePorSala(sala, bloco);
    tbody.innerHTML = '';
    
    let aulaNum = 1;

    grade.forEach(linha => {
      const tr = document.createElement('tr');
      
      if (linha.intervalo) {
        tr.className = 'interval-row';
        tr.innerHTML = `
          <td class="time-col">
            <strong>Intervalo</strong>
            ${linha.inicio} - ${linha.fim}
          </td>
          <td colspan="5">RECREIO / ALINHAMENTO DOCENTE</td>
        `;
      } else {
        let html = `
          <td class="time-col">
            <strong>${aulaNum}ª Aula</strong>
            ${linha.inicio} - ${linha.fim}
          </td>
        `;
        aulaNum++;

        // Utiliza os dias úteis padrão do data.js
        const diasUteis = typeof GC_DIAS_UTEIS !== 'undefined' ? GC_DIAS_UTEIS : ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];

        diasUteis.forEach(dia => {
          const aula = linha[dia];
          if (aula) {
            // Verifica a paleta de cores no data.js ou usa uma genérica
            const cor = (typeof GC_CORES !== 'undefined' && GC_CORES[aula.categoria]) 
              ? GC_CORES[aula.categoria] 
              : { bg: '#E1EAFD', text: '#1E40AF', dot: '#3B82F6' };
              
            html += `
              <td>
                <div class="cell-aula" style="background-color: ${cor.bg}; color: ${cor.text}; border: 1px solid ${cor.dot}40;">
                  <span class="cell-materia">${aula.materia}</span>
                  <span class="cell-prof">${aula.professor}</span>
                  <span class="cell-turma" style="color: ${cor.text};">${aula.turma}</span>
                </div>
              </td>
            `;
          } else {
            html += `<td><div class="cell-livre">Livre</div></td>`;
          }
        });
        tr.innerHTML = html;
      }
      tbody.appendChild(tr);
    });
  }
</script>
</body>
</html>
